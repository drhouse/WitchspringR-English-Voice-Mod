<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gameplay Demo</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .player {
      width: min(960px, 95vw);
    }
    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <main class="player">
    <h1>Gameplay Demo</h1>
    <iframe
      src="https://www.youtube.com/embed/4TGWJj0U9vk"
      title="Gameplay demo"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
